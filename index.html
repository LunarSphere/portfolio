<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Portfolio website of James Kevius Tribble, built as a Rust/WASM browser TUI."
    />
    <title>James Kevius Tribble | Portfolio</title>
    <link data-trunk rel="copy-file" href="public/mascot.png" />
    <link data-trunk rel="copy-file" href="public/resume.pdf" />
    <style>
      :root {
        color-scheme: dark light;
        --page-bg: #0b0f11;
        --page-fg: #d9e7e5;
        --muted: #8fa1a6;
        --accent: #6bd0e3;
        --dock-bg: rgba(13, 19, 22, 0.88);
        --dock-border: rgba(107, 208, 227, 0.35);
      }

      :root[data-theme="light"] {
        --page-bg: #f4f7f8;
        --page-fg: #172126;
        --muted: #53676d;
        --accent: #117285;
        --dock-bg: rgba(244, 247, 248, 0.92);
        --dock-border: rgba(17, 114, 133, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--page-fg);
        font-family:
          "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
          monospace;
        overflow: hidden;
      }

      #app-shell {
        width: 100vw;
        height: 100dvh;
        min-height: 420px;
        padding: 0;
      }

      #terminal {
        width: 100vw;
        height: 100dvh;
        outline: none;
      }

      #terminal [id$="_ratzilla_grid"],
      #terminal #grid {
        outline: none;
      }

      pre {
        margin: 0;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .mascot-dock {
        position: fixed;
        right: clamp(12px, 2vw, 24px);
        bottom: clamp(12px, 2vw, 24px);
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        max-width: min(330px, calc(100vw - 24px));
        padding: 8px 10px;
        border: 1px solid var(--dock-border);
        background: var(--dock-bg);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
        pointer-events: none;
      }

      .mascot-dock img {
        width: 42px;
        height: 42px;
        image-rendering: pixelated;
      }

      .mascot-dock p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.3;
      }

      .mascot-dock strong {
        display: block;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }

      .boot-status {
        position: fixed;
        left: 16px;
        top: 16px;
        max-width: min(540px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 1px solid var(--dock-border);
        background: var(--dock-bg);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        z-index: 2;
      }

      .boot-status strong {
        color: var(--accent);
      }

      noscript {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 28px;
        background: var(--page-bg);
        color: var(--page-fg);
      }

      noscript a {
        color: var(--accent);
      }

      @media (max-width: 700px) {
        body {
          overflow: auto;
        }

        #app-shell {
          min-height: 100dvh;
          padding: 0;
        }

        pre {
          font-size: 11px;
          line-height: 1.24;
        }

        .mascot-dock {
          right: 8px;
          bottom: 8px;
          grid-template-columns: 34px minmax(0, 1fr);
          max-width: calc(100vw - 16px);
          padding: 6px 8px;
        }

        .mascot-dock img {
          width: 34px;
          height: 34px;
        }

        .mascot-dock p {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app-shell" aria-label="Terminal portfolio">
      <div id="terminal" tabindex="0"></div>
    </main>

    <div class="boot-status" id="boot-status" role="status">
      <strong>Loading terminal...</strong> Waiting for WebAssembly.
    </div>

    <aside class="mascot-dock" aria-hidden="true">
      <img src="/mascot.png" alt="" width="42" height="42" />
      <p><strong>kevius@portfolio</strong>Type /help, then Enter.</p>
    </aside>

    <noscript>
      <h1>James Kevius Tribble</h1>
      <p>Rust/WASM terminal-style portfolio.</p>
      <p>
        JavaScript and WebAssembly are required for the interactive TUI. Direct
        links remain available:
        <a href="/resume.pdf">resume</a>,
        <a href="https://github.com/kevius">GitHub</a>,
        <a href="https://www.linkedin.com/in/james-kevius-tribble/">LinkedIn</a>.
      </p>
    </noscript>

    <script type="module">
      const bootStatus = document.getElementById("boot-status");

      function setBootStatus(message) {
        if (bootStatus && !bootStatus.hidden) {
          bootStatus.innerHTML = message;
        }
      }

      window.addEventListener("error", (event) => {
        setBootStatus(
          `<strong>Runtime error.</strong> ${event.message || "Unknown script error."}`,
        );
      });

      window.addEventListener("unhandledrejection", (event) => {
        const reason =
          event.reason && event.reason.message
            ? event.reason.message
            : String(event.reason || "Unknown promise rejection.");
        setBootStatus(`<strong>WASM failed.</strong> ${reason}`);
      });

      function getTerminalGrid() {
        return document.getElementById("terminal_ratzilla_grid");
      }

      function focusTerminal() {
        const terminal = getTerminalGrid();
        if (terminal) terminal.focus({ preventScroll: true });
        return terminal;
      }

      window.addEventListener("TrunkApplicationStarted", () => {
        setBootStatus(
          "<strong>WASM loaded.</strong> Waiting for the terminal grid.",
        );
        window.setTimeout(focusTerminal, 80);
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("#terminal")) {
          window.setTimeout(focusTerminal, 0);
        }
      });

      window.setInterval(() => {
        const grid = getTerminalGrid();
        if (!grid) {
          setBootStatus(
            "<strong>Terminal not mounted.</strong> The Ratzilla grid has not been created.",
          );
          return;
        }

        const rows = grid.querySelectorAll("pre").length;
        const text = grid.innerText.trim();
        if (text.length > 0) {
          if (bootStatus) bootStatus.hidden = true;
          focusTerminal();
          return;
        }

        setBootStatus(
          `<strong>Terminal mounted.</strong> ${rows} rows exist, but no terminal text has painted yet.`,
        );
      }, 250);
    </script>
    <link data-trunk rel="rust" />
  </body>
</html>
