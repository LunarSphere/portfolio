[package]
name = "kevius-portfolio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust/WASM terminal-style portfolio built with Ratzilla and Ratatui."

[dependencies]
console_error_panic_hook = "0.1.7"
critical-section = { version = "1.2", features = ["std"] }
ratatui = { version = "=0.30.1", default-features = false, features = ["all-widgets", "layout-cache"] }
ratzilla = "=0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3.81", features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "Location", "Node", "Window"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
